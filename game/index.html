<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire Builder — Act I: The Peloponnese</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div id="hudTitle">⚑ …</div>
    <div id="hudStats"></div>
    <div id="hudRight">
      <span id="hudProgress"></span>
      <span id="speeds"></span>
      <button class="mini" id="btnSave" title="Save to browser">💾</button>
      <button class="mini" id="btnLoad" title="Load save">📂</button>
      <button class="mini" id="btnNew" title="New game">🔄</button>
    </div>
  </header>

  <main>
    <section id="left">
      <div id="mapModes"></div>
      <canvas id="map"></canvas>
      <div id="legend">
        <span>⚑ yours</span><span>★ region seat</span><span>⚓ port</span><span>✦ sacred</span>
        <span>⛏ ore</span><span>☠ danger</span><span>🏕️ hostile camp</span><span>? fog — scout it</span>
      </div>
    </section>

    <aside id="right">
      <div class="panel" id="tilePanel"><div class="dim pad">Select a tile on the map.</div></div>
      <div class="panel">
        <h3 class="phead">👥 Population</h3>
        <div id="popPanel"></div>
        <h3 class="phead">📜 Decrees</h3>
        <div id="decrees"></div>
      </div>
      <div class="panel" id="industryPanel"></div>
      <div class="panel" id="techPanel"></div>
      <div class="panel" id="diploPanel"></div>
      <div class="panel" id="logPanel">
        <h3 class="phead">🔔 Chronicle</h3>
        <div id="log"></div>
      </div>
    </aside>
  </main>

  <div id="modal"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="map.js"></script>
  <script src="ui.js"></script>
</body>
</html>
